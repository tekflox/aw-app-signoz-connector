name: Test

# Static invariants only — this app has no Python package of its own, so
# there is nothing to measure coverage against and no coverage gate here
# (cf. aw-app-template's, which gates its own template_app package). What
# tests/ DOES cover is the set of manifest↔collector-config agreements that
# fail silently in production: see tests/test_collector_config.py.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

# runs-on is derived from the repo owner rather than hardcoded, for the two
# reasons aw-app-template's own workflow records: the [self-hosted,
# aw-baremetal] runners live in tekflox org runner group 3 (aw-private) and
# can only be shared with repos INSIDE that org — a job aimed at them from
# outside QUEUES FOREVER rather than failing, which reads as "still running";
# and the unqualified `pull_request:` trigger above means anyone can open a
# fork PR against a public repo, so a self-hosted runner there would be
# arbitrary code execution on the bare metal that runs the whole workspace.
jobs:
  test:
    runs-on: ${{ fromJSON(startsWith(github.repository, 'tekflox/') && '["self-hosted","aw-baremetal"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        # requirements-dev.txt is the one source of truth for test deps —
        # the shared release workflow installs it too, and a dep that lives
        # only here fails the RELEASE job while this one stays green.
        run: pip install pytest jsonschema -r requirements-dev.txt
      # tests/validate_manifest.py falls back to a sibling aw-marketplace
      # checkout for the canonical schema when this repo has no local
      # schemas/ copy (by design), and actions/checkout refuses a `path` that
      # escapes $GITHUB_WORKSPACE — so check it out into a subdirectory and
      # point --schema at it explicitly instead of relying on the fallback.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tekflox/aw-marketplace
          path: .aw-marketplace-schema
      - name: Validate manifest
        run: python3 tests/validate_manifest.py aw-app.json --schema .aw-marketplace-schema/schemas/aw-app.schema.json
      - name: Test suite
        run: python3 -m pytest tests/ -q
